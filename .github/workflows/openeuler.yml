# SPDX-License-Identifier: GPL-2.0
name: CSB on openEuler
on: [workflow_dispatch, push, pull_request]

jobs:
  #
  # Build the image once, reuse it in all later jobs
  #
  build-image:
    name: openeuler-csb image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, aarch64 ]
    outputs:
      image-ref: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/openeuler/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/openeuler-csb:${{ matrix.arch }}
          push: true
          # openEuler Image to use: 24.03-SP3 LTS
          build-args:
            BASE_IMAGE=openeuler/openeuler:24.03-lts-sp3

  #
  # Run tests on openEuler via openeuler-csb image
  #
  openEuler:
    name: OpenEuler Tests
    needs: build-image
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.utf8
      LANG: en_US.utf8
    strategy:
      matrix:
        arch: [ aarch64 ]
        test: [ 9]
    container:
      image: ghcr.io/${{ github.repository_owner }}/openeuler-csb:${{ matrix.arch }}
      options: --privileged --cap-add=SYS_ADMIN --security-opt seccomp=unconfined
      volumes:
        # Some scripts require /sys, /proc; cgroup is also needed by docker
        - /sys:/sys
        - /proc:/proc
        - /boot:/boot
        - /lib/modules:/lib/modules

        # Allow using bare metal docker to create a sub-container
        - /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Test ${{ matrix.test }}
        continue-on-error: true
        run: cd /CSB && echo ${{ matrix.test }} | ./run.sh
